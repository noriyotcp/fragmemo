version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # major bump は breaking change のため standalone PR 化する
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # vite/electron 系は互いに peer dependency を持つため一緒に管理
      # ただし major bump は breaking change のため standalone PR 化する
      dev-build:
        patterns:
          - "vite"
          - "electron*"
          - "@vitejs/*"
          - "electron-vite"
        update-types:
          - "minor"
          - "patch"
      # vitest/testing 系
      dev-testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      # 型定義（breaking change がほぼない）
      dev-types:
        patterns:
          - "@types/*"
      # 上記に含まれない残りの dev dependencies
      # major bump は typescript のように影響範囲が広いため standalone PR 化する
      dev-misc:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vite"
          - "electron*"
          - "@vitejs/*"
          - "electron-vite"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "@types/*"
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # electron-vite 5.x requires vite ^5 || ^6 || ^7
      - dependency-name: "vite"
        versions: [">=8"]
      # @vitejs/plugin-react 6.x requires vite ^8, blocked until electron-vite supports vite 8
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
